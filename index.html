<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Ho-Oh - PokeMMO</title>
    <style>
        body {
            background-color: #121824;
            color: #e2e8f0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        h1 {
            color: #ef4444;
            text-align: center;
            font-size: 2.2rem;
            margin-top: 0;
            text-transform: uppercase;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .intro-box {
            background-color: #0f172a;
            padding: 15px;
            border-left: 4px solid #ef4444;
            border-radius: 4px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        h2 {
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            margin-top: 30px;
        }
        .img-guia {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            border: 2px solid #334155;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .grid-pokemon {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card-pokemon {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .card-pokemon h3 {
            margin-top: 0;
            color: #f1f5f9;
            border-bottom: 1px dashed #334155;
            padding-bottom: 5px;
            text-align: center;
        }
        .sprite-container {
            text-align: center;
            margin: 15px 0;
        }
        .sprite-pkmn {
            height: 80px;
            width: auto;
            display: inline-block;
        }
        .stats {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .moves {
            margin-top: 10px;
            padding-left: 20px;
            color: #38bdf8;
            font-weight: bold;
        }
        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #0f172a;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #334155;
            font-size: 0.95rem;
        }
        th {
            background-color: #1e293b;
            color: #f1f5f9;
        }
        tr:nth-child(even) {
            background-color: #141e30;
        }
        .highlight-turn {
            color: #ef4444;
            font-weight: bold;
            text-align: center;
        }
        .tip-box {
            background-color: #1c2d3d;
            border-left: 4px solid #38bdf8;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 30px;
        }

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guías PokeMMO</title>
    <style>
        body {
            background-color: #121824;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
        }
        h1 {
            color: #f1f5f9;
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }
        .btn-guia {
            display: inline-block;
            background-color: #ef4444; /* Rojo temático Ho-Oh */
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-guia:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
        }
        .btn-guia:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Panel de Guías</h1>
        <a href="GUÍA DE HO-OH.html" class="btn-guia">Ver la Guía de Ho-Oh</a>
    </div>

</body>
</html>
